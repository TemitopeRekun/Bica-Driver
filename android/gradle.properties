# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# Increased for Firebase + Capacitor multi-module builds
# We give Gradle enough memory to run Kotlin in-process
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError

# Enable parallel builds for faster multi-module compilation
org.gradle.parallel=true

# Enable Gradle configuration cache
org.gradle.configuration-cache=true

# Use in-process strategy to avoid connection issues between Gradle and Kotlin daemons
kotlin.compiler.execution.strategy=in-process

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Enable non-transitive R classes to reduce build times and APK size
android.nonTransitiveRClass=true

# Java toolchain — let Gradle auto-detect locally installed JDKs (e.g. JDK 21)
# Capacitor 8 plugins require Java 21
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false

android.suppressUnsupportedCompileSdk=36
